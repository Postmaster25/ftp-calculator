<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>MAP &amp; FTP Calculator</title>
<meta name="description" content="Calculate MAP, FTP and VO2max from a ramp test, using the same formulas as ZwiftHacks.com">
<meta name="theme-color" content="#c2410c">

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FTP Calc">

<style>
  :root {
    --bg: #0b0f14;
    --card: #131a22;
    --card-border: #202a35;
    --text: #eef2f6;
    --text-dim: #93a1b0;
    --accent: #f97316;
    --accent-dim: #c2410c;
    --input-bg: #0e141b;
    --input-border: #29343f;
    --radius: 14px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f5f6f8;
      --card: #ffffff;
      --card-border: #e4e7eb;
      --text: #14181d;
      --text-dim: #5b6673;
      --accent: #ea580c;
      --accent-dim: #c2410c;
      --input-bg: #f8f9fb;
      --input-border: #d7dce2;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    min-height: 100%;
  }
  body {
    padding: max(20px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
    display: flex;
    justify-content: center;
  }
  .wrap { width: 100%; max-width: 480px; }

  header { text-align: center; margin-bottom: 18px; }
  header h1 {
    font-size: 22px; margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  header p { margin: 0; color: var(--text-dim); font-size: 13px; }

  .card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 18px;
    margin-bottom: 14px;
  }
  .card h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-dim);
    margin: 0 0 14px;
    font-weight: 600;
  }

  .field { margin-bottom: 14px; }
  .field:last-child { margin-bottom: 0; }
  .field label {
    display: block;
    font-size: 14px;
    margin-bottom: 6px;
    color: var(--text);
  }
  .field .hint { color: var(--text-dim); font-weight: 400; font-size: 12.5px; }
  .input-row { position: relative; }
  input[type="number"], select {
    width: 100%;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: 10px;
    color: var(--text);
    font-size: 17px;
    padding: 12px 44px 12px 14px;
    appearance: none;
    -webkit-appearance: none;
  }
  select { padding-right: 14px; }
  input[type="number"]:focus, select:focus {
    outline: none;
    border-color: var(--accent);
  }
  .unit {
    position: absolute;
    right: 14px; top: 50%; transform: translateY(-50%);
    color: var(--text-dim); font-size: 13px; pointer-events: none;
  }

  .presets { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .preset-btn {
    flex: 1 1 calc(50% - 8px);
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    color: var(--text);
    font-size: 12.5px;
    padding: 10px 8px;
    border-radius: 10px;
    text-align: center;
    cursor: pointer;
    line-height: 1.3;
  }
  .preset-btn.active {
    border-color: var(--accent);
    background: color-mix(in srgb, var(--accent) 14%, var(--input-bg));
    color: var(--accent);
    font-weight: 600;
  }

  .setup-toggle {
    display: flex; align-items: center; justify-content: space-between;
    cursor: pointer; user-select: none;
    margin-bottom: 0;
  }
  .setup-toggle h2 { margin: 0; }
  .chevron { color: var(--text-dim); transition: transform 0.2s; font-size: 12px; }
  .chevron.open { transform: rotate(180deg); }
  #setupBody { overflow: hidden; max-height: 0; transition: max-height 0.25s ease; }
  #setupBody.open { max-height: 600px; }
  #setupBody .inner { padding-top: 14px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  button.calc {
    width: 100%;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 12px;
    font-size: 16px;
    font-weight: 600;
    padding: 15px;
    cursor: pointer;
    margin-top: 4px;
  }
  button.calc:active { background: var(--accent-dim); }

  .results { display: none; }
  .results.show { display: block; }
  .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .result-tile {
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: 12px;
    padding: 12px;
    text-align: center;
  }
  .result-tile .val { font-size: 20px; font-weight: 700; color: var(--accent); }
  .result-tile .lbl { font-size: 11.5px; color: var(--text-dim); margin-top: 3px; line-height: 1.3; }
  .result-tile.wide { grid-column: 1 / -1; }

  footer {
    text-align: center;
    margin-top: 6px;
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.6;
    padding: 0 8px;
  }
  footer a { color: var(--accent); text-decoration: none; }
  footer a:active { opacity: 0.7; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>MAP &amp; FTP Calculator</h1>
    <p>From your ramp test results</p>
  </header>

  <div class="card">
    <div class="setup-toggle" id="setupToggle">
      <h2>Test Setup</h2>
      <span class="chevron" id="setupChevron">▾</span>
    </div>
    <div id="setupBody">
      <div class="inner">
        <div class="presets" id="presets"></div>
        <div class="grid2">
          <div class="field">
            <label>Step duration <span class="hint">sec</span></label>
            <input type="number" id="stepDuration" value="60" inputmode="numeric">
          </div>
          <div class="field">
            <label>Step size <span class="hint">watt</span></label>
            <input type="number" id="stepSize" value="15" inputmode="numeric">
          </div>
          <div class="field">
            <label>First step <span class="hint">watt</span></label>
            <input type="number" id="firstStep" value="100" inputmode="numeric">
          </div>
          <div class="field">
            <label>Warm-up <span class="hint">min</span></label>
            <input type="number" id="warmup" value="5" inputmode="numeric">
          </div>
        </div>
        <div class="field" style="margin-top:12px">
          <label>FTP estimate <span class="hint">% of MAP</span></label>
          <input type="number" id="ftpPct" value="75" inputmode="numeric">
        </div>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Test Result</h2>
    <div class="field">
      <label>Last completed stage</label>
      <div class="input-row">
        <input type="number" id="lastStage" placeholder="e.g. 250" inputmode="numeric">
        <span class="unit">watt</span>
      </div>
    </div>
    <div class="field">
      <label>Duration of unfinished stage</label>
      <div class="input-row">
        <input type="number" id="unfinishedDuration" placeholder="e.g. 30" inputmode="numeric">
        <span class="unit">sec</span>
      </div>
    </div>
    <div class="field">
      <label>Weight <span class="hint">(optional, for w/kg)</span></label>
      <div class="input-row">
        <input type="number" id="weight" placeholder="e.g. 154" inputmode="decimal">
        <span class="unit">lbs</span>
      </div>
    </div>
    <button class="calc" id="calcBtn">Calculate</button>
  </div>

  <div class="card results" id="results">
    <h2>Result</h2>
    <div class="result-grid">
      <div class="result-tile">
        <div class="val" id="rMap">–</div>
        <div class="lbl">MAP (watt)</div>
      </div>
      <div class="result-tile">
        <div class="val" id="rFtp">–</div>
        <div class="lbl">FTP estimate (watt)</div>
      </div>
      <div class="result-tile">
        <div class="val" id="rTarget">–</div>
        <div class="lbl">20-min FTP test target (watt)</div>
      </div>
      <div class="result-tile" id="wkgTile" style="display:none">
        <div class="val" id="rWkg">–</div>
        <div class="lbl">FTP (w/kg)</div>
      </div>
      <div class="result-tile">
        <div class="val" id="rVo2Lmin">–</div>
        <div class="lbl">VO2max (l/min)</div>
      </div>
      <div class="result-tile" id="vo2kgTile" style="display:none">
        <div class="val" id="rVo2Kg">–</div>
        <div class="lbl">VO2max (ml/kg/min)</div>
      </div>
    </div>
  </div>

  <footer>
    Formulas sourced from the<br>
    <a href="https://zwifthacks.com/app/map-ftp-calculator/" target="_blank" rel="noopener">ZwiftHacks.com MAP &amp; FTP Calculator</a>
  </footer>

</div>

<script>
  const presets = [
    { label: "Non-elite male", sub: "15w / 60s / 75%", step: 15, dur: 60, ftp: 75, warmup: 5 },
    { label: "Female",          sub: "15w / 60s / 75%", step: 15, dur: 60, ftp: 75, warmup: 10 },
    { label: "Elite male",      sub: "20w / 60s / 75%", step: 20, dur: 60, ftp: 75, warmup: 5 },
    { label: "GP Lama variant", sub: "25w / 150s / 82%", step: 25, dur: 150, ftp: 82, warmup: 10 },
  ];

  const el = id => document.getElementById(id);

  const stepDurationEl = el("stepDuration");
  const stepSizeEl = el("stepSize");
  const ftpPctEl = el("ftpPct");
  const warmupEl = el("warmup");
  const presetsEl = el("presets");

  function renderPresets() {
    presetsEl.innerHTML = "";
    presets.forEach((p, i) => {
      const btn = document.createElement("div");
      btn.className = "preset-btn";
      btn.innerHTML = `${p.label}<br><span style="opacity:.75">${p.sub}</span>`;
      btn.addEventListener("click", () => {
        stepSizeEl.value = p.step;
        stepDurationEl.value = p.dur;
        ftpPctEl.value = p.ftp;
        warmupEl.value = p.warmup;
        markActivePreset();
      });
      btn.dataset.idx = i;
      presetsEl.appendChild(btn);
    });
    markActivePreset();
  }

  function markActivePreset() {
    const step = Number(stepSizeEl.value);
    const dur = Number(stepDurationEl.value);
    const ftp = Number(ftpPctEl.value);
    [...presetsEl.children].forEach((btn, i) => {
      const p = presets[i];
      btn.classList.toggle("active", p.step === step && p.dur === dur && p.ftp === ftp);
    });
  }

  [stepDurationEl, stepSizeEl, ftpPctEl].forEach(elm => elm.addEventListener("input", markActivePreset));

  // Setup collapse/expand
  const setupToggle = el("setupToggle");
  const setupBody = el("setupBody");
  const setupChevron = el("setupChevron");
  setupToggle.addEventListener("click", () => {
    const open = setupBody.classList.toggle("open");
    setupChevron.classList.toggle("open", open);
  });

  function round(n, decimals = 0) {
    const f = Math.pow(10, decimals);
    return Math.round(n * f) / f;
  }

  el("calcBtn").addEventListener("click", () => {
    const stepDuration = Number(stepDurationEl.value) || 60;
    const stepSize = Number(stepSizeEl.value) || 25;
    const ftpPct = Number(ftpPctEl.value) || 75;

    const lastStage = Number(el("lastStage").value) || 0;
    const unfinished = Number(el("unfinishedDuration").value) || 0;
    const weightLbs = Number(el("weight").value) || 0;
    const weightKg = weightLbs * 0.45359237;

    // Mirrors zwifthacks.com's calculator exactly (reverse-engineered from its bundle):
    // MAP is rounded to a whole watt first, and everything downstream is derived from
    // that rounded MAP - including the FTP test target, which uses the un-rounded
    // FTP fraction (ftpPct% of MAP) divided by 0.95, not the rounded/displayed FTP.
    const map = Math.round(lastStage + stepSize * (unfinished / stepDuration));
    const ftpFraction = (ftpPct / 100) * map;
    const ftp = Math.round(ftpFraction);
    const target = Math.round(ftpFraction / 0.95);
    // Site's live formula uses +0.43 here, even though its own text says +0.435.
    const vo2Lmin = 0.01141 * map + 0.43;

    el("rMap").textContent = map + " w";
    el("rFtp").textContent = ftp + " w";
    el("rTarget").textContent = target + " w";
    el("rVo2Lmin").textContent = round(vo2Lmin, 1) + " l/min";

    const wkgTile = el("wkgTile");
    const vo2kgTile = el("vo2kgTile");
    if (weightKg > 0) {
      el("rWkg").textContent = round(ftpFraction / weightKg, 1);
      el("rVo2Kg").textContent = round((vo2Lmin * 1000) / weightKg, 1);
      wkgTile.style.display = "";
      vo2kgTile.style.display = "";
    } else {
      wkgTile.style.display = "none";
      vo2kgTile.style.display = "none";
    }

    el("results").classList.add("show");
    el("results").scrollIntoView({ behavior: "smooth", block: "nearest" });
  });

  renderPresets();

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
